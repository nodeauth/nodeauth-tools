name = "nodeauth-tools"
main = "src/index.ts"
compatibility_date = "2026-03-17"

workers_dev = false
preview_urls = false

[observability]
enabled = false

[[routes]]
pattern = "tools.nodeauth.io/*"
zone_name = "nodeauth.io"

[assets]
directory = "./public"
binding = "ASSETS"

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false

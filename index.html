<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NodeAuth Worker Deploy Helper | 部署辅助工具</title>
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
    <link rel="stylesheet" href="assets/style.css">
</head>

<body>
    <!-- SVG Icon Sprite -->
    <svg style="display:none">
        <symbol id="icon-copy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <rect width="14" height="14" x="8" y="8" rx="2" ry="2" />
            <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2" />
        </symbol>
        <symbol id="icon-check" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
            stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12" />
        </symbol>
    </svg>

    <!-- Theme & Language Switcher -->
    <div class="theme-switcher">
        <button onclick="toggleTheme()" id="theme-btn">☀️</button>
    </div>
    <div class="lang-switcher">
        <button onclick="toggleLang()" id="lang-btn">简体中文</button>
    </div>

    <div class="container">
        <header>
            <div class="logo-container">
                <img src="assets/logo.svg" alt="NodeAuth Logo" class="logo">
            </div>
            <h1 id="main-title">NodeAuth Worker <span data-i18n="header_sub">部署辅助工具</span></h1>
        </header>

        <main>
            <!-- Card 1: Random String -->
            <section class="tool-section">
                <h2 data-i18n="t1_title">🎲 随机密钥生成</h2>
                <div class="subtitle" data-i18n="t1_subtitle">用于生成 64 位强度的 JWT_SECRET 或 ENCRYPTION_KEY。</div>
                <label data-i18n="t1_label">生成的安全字符串 (64位)：</label>
                <div class="output-area">
                    <code id="random-out"></code>
                    <button class="btn-copy" onclick="copy('random-out')" data-i18n-title="btn_copy_tips">
                        <svg>
                            <use href="#icon-copy" />
                        </svg>
                    </button>
                </div>
                <button class="btn-action" onclick="generateRandom()" data-i18n="btn_regenerate">重新生成</button>
            </section>

            <!-- Card 2: Base64 -->
            <section class="tool-section">
                <h2 data-i18n="t2_title">📦 Base64 编码</h2>
                <div class="subtitle" data-i18n="t2_subtitle">将环境变量包装为 base64: 前缀格式。</div>
                <label data-i18n="t2_label">输入原始变量：</label>
                <input type="text" id="b64-in" data-placeholder="t2_ph" oninput="encodeBase64()">
                <label data-i18n="t2_out_label">编码输出：</label>
                <div class="output-area">
                    <code id="b64-out"></code>
                    <button class="btn-copy" onclick="copy('b64-out')" data-i18n-title="btn_copy_tips">
                        <svg>
                            <use href="#icon-copy" />
                        </svg>
                    </button>
                </div>
            </section>

            <!-- Card 2.5: Hex -->
            <section class="tool-section">
                <h2 data-i18n="t_hex_title">🔡 Hex 编码</h2>
                <div class="subtitle" data-i18n="t_hex_subtitle">将敏感值转换为十六进制 hex: 格式。</div>
                <label data-i18n="t2_label">输入原始变量：</label>
                <input type="text" id="hex-in" data-placeholder="t2_ph" oninput="encodeHex()">
                <label data-i18n="t2_out_label">编码输出：</label>
                <div class="output-area">
                    <code id="hex-out"></code>
                    <button class="btn-copy" onclick="copy('hex-out')" data-i18n-title="btn_copy_tips">
                        <svg>
                            <use href="#icon-copy" />
                        </svg>
                    </button>
                </div>
            </section>

            <!-- Card 3: AES -->
            <section class="tool-section">
                <h2 data-i18n="t3_title">🔐 AES 批量加密</h2>
                <div class="subtitle" data-i18n="t3_subtitle">支持多行 KEY=VALUE 解析。浏览器本地并行计算。</div>
                <label data-i18n="t3_secret_label">根密钥 (明文 JWT_SECRET)：</label>
                <input type="text" id="aes-secret" data-placeholder="t3_secret_ph">

                <label data-i18n="t3_license_label">授权码 (NODEAUTH_LICENSE)：</label>
                <input type="text" id="aes-license" data-placeholder="t3_license_ph">

                <label data-i18n="t3_target_label">待加密环境变量 (支持多行、KEY=VALUE 格式)：</label>
                <textarea style="min-height: 150px;" id="aes-target" rows="3"
                    data-placeholder="t3_target_ph"></textarea>

                <label data-i18n="t3_out_label">AES 加密输出 (aes:iv:tag:cipher)：</label>
                <div class="output-area" style="min-height: 150px; padding-top: 40px !important;">
                    <pre id="aes-out" data-i18n="ready_status">准备就绪</pre>
                    <button class="btn-copy" onclick="copy('aes-out')" data-i18n-title="btn_copy_tips">
                        <svg>
                            <use href="#icon-copy" />
                        </svg>
                    </button>
                </div>
                <button class="btn-action" onclick="encryptAES()" data-i18n="btn_encrypt">执行加密</button>
            </section>
        </main>

        <footer>
            <p>© 2026 NodeAuth.io | <span data-i18n="footer_note">私密本地计算 · 极致安全保障</span></p>
        </footer>
    </div>

    <script src="assets/app.js"></script>
</body>

</html>
